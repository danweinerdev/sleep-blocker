<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Active state: sleep is being blocked. Warm amber-to-magenta, drawn at
       full saturation so it reads as "on" next to the muted idle icon. -->
  <defs>
    <linearGradient id="active" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <!-- Lemniscate drawn as a stroked path: two lobes meeting at the centre.
       Stroke rather than fill keeps the counters open at small sizes. -->
  <path
    d="M 256 256
       C 216 168, 160 144, 120 144
       C 68 144, 32 190, 32 256
       C 32 322, 68 368, 120 368
       C 160 368, 216 344, 256 256
       C 296 168, 352 144, 392 144
       C 444 144, 480 190, 480 256
       C 480 322, 444 368, 392 368
       C 352 368, 296 344, 256 256
       Z"
    fill="none"
    stroke="url(#active)"
    stroke-width="62"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
