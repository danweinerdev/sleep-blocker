[package]
name = "sleep-block-bin"
description = "GUI toggle for blocking system sleep"
version.workspace = true
edition.workspace = true

[lib]
name = "sleep_block_app"
path = "src/lib.rs"

[[bin]]
name = "sleep-block"
path = "src/main.rs"

[[bin]]
name = "sleep-blockd"
path = "src/bin/sleep-blockd.rs"

[dependencies]
sleep-block-core = { path = "../sleep-block-core" }
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
png = "0.18.1"
zbus = "5.19.0"
event-listener = "5"
